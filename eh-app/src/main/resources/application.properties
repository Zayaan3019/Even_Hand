# Local only. The tool is run by the instructor on his own machine; marks and
# identities never leave it. Both of these are asserted by tests in eh-app.
server.address=127.0.0.1
server.port=8642

spring.datasource.url=jdbc:sqlite:${eh.data.dir:./data}/even-hand.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The pseudonymisation key file is written here and never read back by the
# application. Only the instructor holds it.
eh.key.dir=./keys

spring.thymeleaf.cache=false
