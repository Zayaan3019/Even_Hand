name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # Course policy is Java 21. The build also sets maven.compiler.release=21,
          # so the bytecode level holds even when a developer's local JDK is newer.
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The embedding model is pinned by revision and SHA-256, so the cache key never goes stale.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.even-hand/models
          key: minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Fetch the embedding model
        run: sh scripts/fetch-model.sh

      - name: Build and test
        run: ./mvnw -B verify

      - name: Print the scenario matrix
        # The audit's verdict on every marking arrangement, printed on every commit.
        # If a change ever makes the platform accept a design it should refuse, that
        # shows up here as well as in the test report.
        run: |
          ./mvnw -B -q -pl eh-core,eh-numerics,eh-design -am install -DskipTests
          java -cp "eh-design/target/test-classes:eh-design/target/classes:eh-core/target/classes:eh-numerics/target/classes" \
            in.ac.iitm.evenhand.design.AuditReport

  statistics:
    # Parameter recovery and interval coverage are seeded but slow, so they run
    # separately rather than on every push to a feature branch.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/cache@v4
        with:
          path: ~/.even-hand/models
          key: minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - run: sh scripts/fetch-model.sh
      - run: ./mvnw -B -Pstats verify
