name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Course policy is Java 21. The build also sets maven.compiler.release=21,
          # so the bytecode level holds even when a developer's local JDK is newer.
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: ./mvnw -B verify

      - name: Print the scenario matrix
        # The audit's verdict on every marking arrangement, printed on every commit.
        # If a change ever makes the platform accept a design it should refuse, that
        # shows up here as well as in the test report.
        run: |
          ./mvnw -B -q -pl eh-core,eh-numerics,eh-design -am install -DskipTests
          java -cp "eh-design/target/classes:eh-core/target/classes:eh-numerics/target/classes" \
            in.ac.iitm.evenhand.design.AuditReport

  statistics:
    # Parameter recovery and interval coverage are seeded but slow, so they run
    # separately rather than on every push to a feature branch.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw -B -Pstats verify
